            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;

        }
        body::before {
            content: "";

            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),

        }
        .container {
            background: rgba(30, 41, 59, 0.7);

            border-radius: 24px;

            width: 100%;

            position: relative;
            z-index: 1;
        }
        .header-box {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 25px;
        }
        .header-box h2 {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .header-box p {

        }
        .input-group {

        }
        .input-group label {
            display: block;
            margin-bottom: 6px;

            font-weight: 700;
            color: #38bdf8;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);

        }
        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }
        .timer {
            font-size: 16px;
            color: #fbbf24;
            margin-bottom: 15px;
            font-weight: 700;
            background: rgba(251, 191, 36, 0.1);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(251, 191, 36, 0.2);
            display: inline-block;
        }
        .question-box {
            text-align: right;
            margin-bottom: 20px;
        }
        .question-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 18px;
            line-height: 1.6;
            color: #f1f5f9;
        }
        .options label {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.2s;
            font-size: 14px;
        }
        .options label:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .options input {
            margin-left: 12px;
            accent-color: #38bdf8;
        }
        .circle-score {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(#38bdf8 var(--percent, 0%), #334155 0);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 30px;
            font-weight: 800;
            position: relative;
        }
        .circle-score::before {
            content: "";
            position: absolute;
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: #1e293b;
        }
        .circle-score div, .circle-score span {
            position: relative;
            z-index: 1;
        }
        .circle-score span {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }
        .info-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            padding: 16px;
            text-align: right;
            margin-top: 20px;
            font-size: 14px;
            line-height: 2.2;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hidden { display: none; }
        .footer-rights {
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-box">
        <h2>اختبار فيزياء 2 بكالوريا 2027</h2>
        <p>الدرس الرابع: عزم القوة (Torque)</p>
    </div>
    <!-- 1. شاشة بداية الاختبار -->
    <div id="start-screen">
        <div class="input-group">
            <label>اسم الطالب:</label>
            <input type="text" id="student-name" placeholder="أدخل اسمك الثلاثي">
        </div>
        <div class="input-group">
            <label>كود الطالب:</label>
            <!-- استخدام password لإخفاء الكود بنجوم -->
            <input type="password" id="student-code" placeholder="أدخل كود الطالب الخص بك">
        </div>
        <button class="btn" onclick="startQuiz()">بدء الاختبار </button>
    </div>
    <!-- 2. شاشة الأسئلة -->
    <div id="quiz-screen" class="hidden">
        <div class="timer" id="timer-display">⏱️ 00:00</div>
        <div class="question-box">
            <div class="question-title" id="q-title"></div>
            <div class="options" id="q-options"></div>
        </div>
        <button class="btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ⬅️</button>
    </div>
    <!-- 3. شاشة النتيجة -->
    <div id="result-screen" class="hidden">
        <h3> تم إنهاء الاختبار بنجاح</h3>
        <div class="circle-score" id="score-circle">
            <div id="score-text">0</div>
            <span>من 40</span>
        </div>
        <div class="info-card">
            <div> <b>اسم الطالب:</b> <span id="res-name"></span></div>
            <!-- كود الطالب مخفي تماماً هنا -->
            <div> <b>التقدير العام:</b> <span id="res-grade"></span></div>
            <div>⏱️ <b>الوقت المستغرق:</b> <span id="res-time"></span></div>
            <div>✅ <b>النتيجة النهائية:</b> <span id="res-score"></span> من 40</div>
        </div>
        <button class="btn" onclick="location.reload()">إعادة الاختبار </button>
    </div>
    <div class="footer-rights">
        جميع الحقوق محفوظة للأستاذ <b>محمد أمين نظير</b>
    </div>
</div>
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<script>
    const BOT_TOKEN = "7953282245:AAGIlyAAnbJ4I50-cR08c4K3S53_lIs04S0";
    const CHAT_ID = "6790938637";
    const questions = [
        { q: "س1: وحدة قياس عزم القوة في الجملة الدولية هي:", options: ["N.m", "N/m", "J.s", "N"], correct: 0 },
        { q: "س2: يكون عزم القوة معدوماً إذا كان حامل القوة:", options: ["يعامد محور الدوران", "يوازي محور الدوران أو يقطعه", "يبعد عن محور الدوران", "يمس محور الدوران"], correct: 1 },
        { q: "س3: الذراع هو المسافة العمودية بين:", options: ["القوة ونقطة التأثير", "حامل القوة ومحور الدوران", "محور الدوران ومركز الثقل", "نقطتين من الجسم"], correct: 1 },
        { q: "س4: العوامل التي يتوقف عليها عزم القوة هي:", options: ["شدة القوة والذراع", "الكتلة والسرعة", "المسافة والزمن", "القوة والسرعة"], correct: 0 }
    ];
    let currentQ = 0, score = 0;
    let studentName = "", studentCode = "";
    let startTime, timerInterval;
    let wrongQuestions = [];
    function startQuiz() {
        studentName = document.getElementById('student-name').value.trim();
        studentCode = document.getElementById('student-code').value.trim();
        if (!studentName || !studentCode) {
            alert("يرجى إدخال اسمك وكودك أولاً!");
            return;
        }
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        showQuestion();
    }
    function updateTimer() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(elapsed / 60);
        const s = elapsed % 60;
        document.getElementById('timer-display').innerText = `⏱️ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = q.q;
        const optionsDiv = document.getElementById('q-options');
        optionsDiv.innerHTML = '';
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `
                <label>
                    <input type="radio" name="option" value="${idx}">
                    ${opt}
                </label>
            `;
        });
        if (currentQ === questions.length - 1) {
            document.getElementById('next-btn').innerText = "إنهاء الاختبار ";
        }
    }
    function nextQuestion() {
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) {
            alert("يرجى اختيار إجابة أولاً!");
            return;
        }
        const answer = parseInt(selected.value);
        if (answer === questions[currentQ].correct) {
            score += 10;
        } else {
            wrongQuestions.push(currentQ + 1);
        }
        currentQ++;
        if (currentQ < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }
    function finishQuiz() {
        clearInterval(timerInterval);
        const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-time').innerText = `${minutes} دقيقة و ${seconds} ثانية`;
        let grade = "";
        if (score >= 35) grade = "ممتاز ";
        else if (score >= 25) grade = "جيد جداً ";
        else if (score >= 20) grade = "مقبول ⚠️";
        else grade = "يحتاج إلى مراجعة وتكرار ⚠️";
        document.getElementById('res-grade').innerText = grade;
        const percent = (score / 40) * 100;
        document.getElementById('score-circle').style.setProperty('--percent', `${percent}%`);
        document.getElementById('score-text').innerText = score;
        sendToTelegram(studentName, studentCode, score, minutes, seconds, grade, wrongQuestions);
    }
    function sendToTelegram(name, code, score, m, s, grade, wrongArr) {
        let wrongText = wrongArr.length > 0 ? wrongArr.join(', ') : 'لا يوجد إجابات خاطئة ';
        const message = ` نتيجة اختبار فيزياء جديدة\n\n` +
                        ` اسم الطالب: ${name}\n` +
                        ` الكود: ${code}\n` +
                        ` الدرجة: ${score} / 40\n` +
                        ` التقدير: ${grade}\n` +
                        `⏱️ الوقت: ${m} دقيقة و ${s} ثانية\n` +
                        `❌ الأسئلة الخاطئة: ${wrongText}`;
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        form.target = 'hidden_iframe';
        const chatInput = document.createElement('input');
        chatInput.type = 'hidden';
        chatInput.name = 'chat_id';
        chatInput.value = CHAT_ID;
        form.appendChild(chatInput);
        const textInput = document.createElement('input');
        textInput.type = 'hidden';
        textInput.name = 'text';
        textInput.value = message;
        form.appendChild(textInput);
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
    }
</script>
</body>
</html>
